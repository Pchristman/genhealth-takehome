[project]
name = "order-intake"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlmodel",
  "pydantic-settings",
  "python-multipart",
  "email-validator",
  "pyjwt",
  "anthropic",
  "pdfplumber",
]

[dependency-groups]
dev = ["pytest", "httpx", "ruff", "reportlab", "pillow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
